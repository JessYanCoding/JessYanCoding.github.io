# ---------------------------------------------------------------------------
#  Build
# ---------------------------------------------------------------------------
timezone:         Asia/Shanghai
future:           true
highlighter:      rouge
markdown:         kramdown

# 首页展示的最新文章数量
recent_posts:     8
chars_per_minute: 350   # 中文按字符估算阅读时间

# 保持既有文章 URL 不变（/habit/、/templates/ ...），不要改
permalink:        /:categories/:title/

kramdown:
  input:          GFM
  auto_ids:       true
  toc_levels:     2..3
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist

sass:
  sass_dir:       _sass
  style:          compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Gruntfile.js
  - package.json
  - package-lock.json
  - node_modules
  - .jshintrc
  - vendor
